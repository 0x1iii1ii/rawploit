<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 Kernel Exploit 13.XX</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }

      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }

      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }

      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      #detect {
        padding: 16px 18px;
      }

      #det-state {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      #det-info {
        font-size: 13px;
        color: #8b95a3;
        margin: 0 0 4px;
      }

      #det-info b {
        color: #c8ced8;
        font-weight: 600;
      }

      #det-cache {
        font-size: 12px;
        color: #5c6672;
        margin: 0 0 10px;
        min-height: 14px;
      }

      #det-cache.cacheok {
        color: #7fd0a0;
      }

      #exploit {
        display: none;
      }

      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }

      #wrap {
        padding: 0;
      }

      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        padding: 14px 18px;
      }

      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }

      .ok,
      .safe {
        color: #7fd0a0;
      }

      .bad,
      .danger {
        color: #d08a7f;
      }

      .warn {
        color: #d8c07f;
      }
    </style>
  </head>

  <body>
    <div id="brand">
      <img
        src="logo.png"
        alt="PS4 Kernel Exploit 13.XX logo"
        loading="lazy"
        decoding="async"
        width="30"
        height="30"
      />
      <b>PS4 Kernel Exploit 13.XX</b>
    </div>
    <div id="detect">
      <div id="det-state">detecting firmware...</div>
      <div id="det-info"></div>
      <div id="det-cache"></div>
    </div>
    <div id="exploit">
      <div id="spin"></div>
      <div id="msg">Restart your console</div>
      <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
      </div>
    </div>
    <script>
      (function () {
        var stateEl = document.getElementById("det-state");
        var infoEl = document.getElementById("det-info");
        var cacheEl = document.getElementById("det-cache");

        function setState(text, cls) {
          stateEl.textContent = text;
          stateEl.className = cls || "";
        }

        function setCache(text, ok) {
          cacheEl.textContent = text;
          cacheEl.className = ok ? "cacheok" : "";
        }

        var SUPPORTED = {
          1302: 1,
          1304: 1,
          1350: 1,
          1352: 1,
        };

        var params = new URLSearchParams(location.search);
        var key = null;
        var fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

        if (m) {
          var ms = parseInt(m[2], 16).toString(16).padStart(2, "0");

          key = m[1] + "." + ms;

          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }

        var forced = params.get("force") === "1";
        var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

        infoEl.innerHTML =
          "firmware <b>" +
          (key || "unknown") +
          "</b> &middot; <b>" +
          (supported ? "supported" : "not in this build's kernel table") +
          "</b>";

        function launch() {
          document.getElementById("detect").style.display = "none";
          document.getElementById("exploit").style.display = "block";
          if (!window.__jbLoaded) {
            window.__jbLoaded = true;
            import("./jb.js?v=10").catch(function (err) {
              console.error("Failed to load jb.js:", err);
              document.body.classList.remove("done");
              document.body.classList.add("fail");
              document.getElementById("msg").textContent =
                "Failed to load exploit";
            });
          }
        }

        function waitForTap(msg, action) {
          setState(msg, "warn");
          function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
          }
          window.addEventListener("click", fire);
          window.addEventListener("keydown", fire);
        }

        if (!supported) {
          setState("UNSUPPORTED FIRMWARE", "bad");
          waitForTap(
            "UNSUPPORTED (" +
              (key || "unknown") +
              ") -- press X or tap to run anyway",
            launch,
          );
          return;
        }

        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
          launch();
        } else if (!navigator.onLine) {
          setCache("offline -- from cache", true);
          launch();
        } else if (ac.status === ac.IDLE) {
          setCache("cached", true);
          launch();
        } else if (ac.status === ac.UPDATEREADY) {
          try {
            ac.swapCache();
          } catch (e) {}
          setCache("update downloaded", true);
          waitForTap(
            "UPDATE READY -- press X or tap to reload & run",
            function () {
              location.reload();
            },
          );
        } else {
          setCache("checking cache...");
          ac.addEventListener("downloading", function () {
            setCache("caching for offline (first run)...");
          });
          ac.addEventListener("progress", function (e) {
            if (e && e.total) {
              setCache(
                "caching " + Math.round((e.loaded / e.total) * 100) + "%",
              );
            }
          });
          ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", launch);
          });
          ac.addEventListener("updateready", function () {
            try {
              ac.swapCache();
            } catch (e) {}
            setCache("update downloaded", true);
            waitForTap(
              "UPDATE READY -- press X or tap to reload & run",
              function () {
                location.reload();
              },
            );
          });
          ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            launch();
          });
          ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", launch);
          });
          ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", launch);
          });
        }
      })();
    </script>
  </body>
</html>
